<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網頁版 Minecraft ｜ 內嵌遊玩</title>
<style>
  :root{ --bar-h:46px; }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:#0f1114; color:#e7e9ee;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* 頂部工具列 */
  #bar{
    flex:0 0 var(--bar-h); display:flex; align-items:center; gap:10px;
    padding:0 12px; background:#171a1f; border-bottom:1px solid #2a2f38;
  }
  #bar .dot{ width:10px; height:10px; border-radius:50%; background:#3ddc84; flex:0 0 auto; }
  #bar .title{ font-size:13.5px; font-weight:600; letter-spacing:.2px; white-space:nowrap; }
  #bar .src{ font-size:12px; color:#7d8797; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bar .spacer{ flex:1 1 auto; }
  #bar button{
    font:inherit; font-size:12.5px; padding:6px 12px; border-radius:7px;
    background:#252b34; color:#dfe4ec; border:1px solid #384150; cursor:pointer;
    white-space:nowrap;
  }
  #bar button:hover{ background:#313945; }
  #bar button:active{ transform:translateY(1px); }

  /* 遊戲舞台 */
  #stage{ position:relative; flex:1 1 auto; background:#0b0d10; }
  #game{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; display:block; background:#0b0d10;
  }

  /* 載入遮罩 */
  #loading{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:#0b0d10; transition:opacity .35s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:38px; height:38px; border-radius:50%;
    border:3px solid #2b3340; border-top-color:#3ddc84;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p{ margin:0; font-size:13px; color:#8b95a5; }

  /* 提示條 */
  #notice{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%); z-index:6;
    max-width:min(600px,92vw); padding:12px 16px; border-radius:10px;
    background:#241d17; border:1px solid #6b4a20; color:#ffd9a8;
    font-size:12.5px; line-height:1.7; display:none;
  }
  #notice.show{ display:block; }
  #notice a{ color:#ffc06b; }

  @media (max-width:640px){
    #bar .src{ display:none; }
    #bar .title{ font-size:12.5px; }
  }
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <span class="dot"></span>
    <span class="title">網頁版 Minecraft</span>
    <span class="src">來源：b23.tv/vNqUglo</span>
    <span class="spacer"></span>
    <button id="btnReload" type="button">重新載入</button>
    <button id="btnFull"   type="button">全螢幕</button>
  </header>

  <div id="stage">
    <!-- 遊戲直接內嵌在此，不會開新分頁 -->
    <iframe
      id="game"
      src="https://b23.tv/vNqUglo"
      title="網頁版 Minecraft"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write; encrypted-media"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      loading="eager"></iframe>

    <div id="loading">
      <div class="spinner"></div>
      <p>正在載入遊戲…</p>
    </div>

    <div id="notice"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var GAME_URL = 'https://b23.tv/vNqUglo';

  var iframe  = document.getElementById('game');
  var loading = document.getElementById('loading');
  var notice  = document.getElementById('notice');
  var stage   = document.getElementById('stage');

  var loaded = false;
  var timer  = null;

  function hideLoading() {
    if (loaded) return;
    loaded = true;
    loading.classList.add('hide');
    clearTimeout(timer);
  }

  function showNotice(html) {
    notice.innerHTML = html;
    notice.classList.add('show');
  }

  function hideNotice() {
    notice.classList.remove('show');
  }

  /* iframe 載入完成 */
  iframe.addEventListener('load', hideLoading);

  /* 保底計時器：超過 9 秒仍未完成就提示 */
  function armFallback() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!loaded) {
        loading.classList.add('hide');
        showNotice(
          '載入時間過長，畫面可能為空白。<br>' +
          '原因通常是目標網站設有 <b>X-Frame-Options</b> 或 <b>CSP frame-ancestors</b>，' +
          '禁止被其他網頁內嵌。若確實如此，請改為在頁面內自行實作遊戲，或提供遊戲本體的網址。'
        );
      }
    }, 9000);
  }

  armFallback();

  /* 重新載入（加時間戳避開快取） */
  document.getElementById('btnReload').addEventListener('click', function () {
    loaded = false;
    hideNotice();
    loading.classList.remove('hide');
    var sep = GAME_URL.indexOf('?') > -1 ? '&' : '?';
    iframe.src = GAME_URL + sep + '_t=' + Date.now();
    armFallback();
  });

  /* 全螢幕（針對遊戲區域，而不是整個瀏覽器視窗） */
  document.getElementById('btnFull').addEventListener('click', function () {
    var el = stage;
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;

    if (!fsEl) {
      if (el.requestFullscreen)            el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen)            document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  /* 按 Esc 或離開全螢幕時，避免版面卡住 */
  document.addEventListener('fullscreenchange', function () {
    window.dispatchEvent(new Event('resize'));
  });
})();
</script>
</body>
</html>
